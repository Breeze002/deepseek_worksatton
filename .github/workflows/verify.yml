name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `verify` is the portable chain only: build + static audits + smoke + DOM interaction tests.
      # The machine-bound visual check (`npm run verify:visual`) stays out on purpose: it needs a
      # local Chrome and the installed Harness, so it cannot run on a bare runner.
      - run: npm ci
      - run: npm run verify
